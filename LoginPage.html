<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Warung UMKM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="navbar">
      <div class="brand" id="brandBtn" style="cursor: pointer;">
        <span class="brand-title">Warung</span>
        <span class="brand-divider">|</span>
        <span class="brand-subtitle">UMKM</span>
      </div>
    </header>

    <main class="login-container">
      <div class="card-login">
        <div class="card-header">
          <h1 class="card-title">Selamat datang kembali.</h1>
          <p class="card-subtitle">Masuk ke panel pengelolaan warung Anda.</p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <div class="form-label-row">
              <label for="email">EMAIL BISNIS</label>
              <span class="badge-required">Wajib</span>
            </div>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@warunganda.com"
              required
            />
          </div>

          <div class="form-group">
            <div class="form-label-row">
              <label for="password">KATA SANDI</label>
              <a href="#lupa-sandi" class="link-forgot">Lupa sandi?</a>
            </div>
            <div class="input-password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
              <button type="button" class="btn-toggle-password" id="togglePasswordBtn">Lihat</button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">Login &rarr;</button>
        </form>

        <div class="card-footer">
          <p>Belum punya akun? <a href="RegisterPage.html">Daftar sekarang</a></p>
        </div>
      </div>
    </main>

    <script>
      document.getElementById('brandBtn').addEventListener('click', function () {
        window.location.href = 'LandingPage.html';
      });

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = 'Dashboard.html';
      });

      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('password');

      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.textContent = isPassword ? 'Sembunyi' : 'Lihat';
      });
    </script>
</body>
</html>
