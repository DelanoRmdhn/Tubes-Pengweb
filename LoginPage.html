<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Warung UMKM</title>
    <link rel="stylesheet" href="loginPage.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand">
        <span class="brand-title">Warung</span>
        <span class="brand-divider">|</span>
        <span class="brand-subtitle">UMKM</span>
      </div>
    </header>

    <main class="login-container">
      <div class="card-login">
        <div class="card-header">
          <h1 class="card-title">Selamat datang kembali.</h1>
          <p class="card-subtitle">Masuk ke panel pengelolaan warung Anda.</p>
        </div>

        <form class="login-form">
          <div class="form-group">
            <div class="form-label-row">
              <label for="email">EMAIL BISNIS</label>
              <span class="badge-required">Wajib</span>
            </div>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@warunganda.com"
              required
            />
          </div>

          <div class="form-group">
            <div class="form-label-row">
              <label for="password">KATA SANDI</label>
              <a href="#lupa-sandi" class="link-forgot">Lupa sandi?</a>
            </div>
            <div class="input-password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
              <button type="button" class="btn-toggle-password">Lihat</button>
            </div>
          </div>

          <button type="submit" class="btn-login">Login &rarr;</button>
        </form>

        <div class="card-footer">
          <p>Belum punya akun? <a href="RegisterPage.html">Daftar sekarang</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
